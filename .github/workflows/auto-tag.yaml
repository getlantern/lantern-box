name: Auto-tag patch release

on:
  push:
    branches: [main]
    # Trigger on changes that affect the built lantern-box binary only.
    # deploy/packer/** intentionally NOT in this list: under Reflog's
    # Option B, packer changes don't produce a new .deb, so they don't
    # need a version bump. build-images.yaml self-triggers on those.
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'Dockerfile.goreleaser'
      - 'deploy/trust/**'
      - '.goreleaser.yaml'
      - 'cmd/release/*.service'

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    # Skip if the push was a tag-created commit (avoid loops)
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A `client-only` label on the merged PR releases without moving the
      # proxy fleet: lantern-cloud's hot-swap follows GitHub's latest release,
      # which this release then isn't. Looked up before tagging so a failed
      # lookup leaves nothing half-released.
      - name: Check for client-only label
        id: labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          client_only=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null) | .labels[].name] | any(. == "client-only")')
          echo "client_only=$client_only" >> "$GITHUB_OUTPUT"
          echo "client-only: $client_only"

      - name: Bump patch version and tag
        id: tag
        run: |
          # Get the latest semver tag
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v0.0.1"
          else
            # The tag name ends up on gh's command line, so accept only a
            # plain vMAJOR.MINOR.PATCH.
            if [[ ! "$latest" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Latest tag is not plain semver: $latest" >&2
              exit 1
            fi
            # Strip 'v' prefix, split into parts, bump patch
            version="${latest#v}"
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Bumping $latest → $next"

      - name: Create and push tag
        env:
          RELEASE_REF: ${{ steps.tag.outputs.next }}
        run: |
          git tag "$RELEASE_REF"
          git push origin "$RELEASE_REF"

      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ steps.tag.outputs.next }}
          CLIENT_ONLY: ${{ steps.labels.outputs.client_only }}
        run: |
          gh workflow run release.yaml --ref "$RELEASE_REF" -f client_only="$CLIENT_ONLY"
          # The versioned sing-box image that lantern-cloud pins triangle
          # backends to. A GITHUB_TOKEN tag push doesn't trigger push.yaml.
          gh workflow run push.yaml --ref "$RELEASE_REF"
